# Traffic Simulator Configuration File
# Edit these values to customize the simulation behavior

# ============ Performance Settings ============
target_fps=60
enable_vsync=true
enable_lod=true
enable_frustum_culling=true
enable_display_lists=true

# ============ LOD Distances (in world units) ============
# Vehicles - larger objects, can be seen from farther
vehicle_lod_high=50.0
vehicle_lod_medium=100.0
vehicle_lod_low=200.0
vehicle_lod_cull=300.0

# Pedestrians - smaller objects, less detail needed at distance
pedestrian_lod_high=30.0
pedestrian_lod_medium=60.0
pedestrian_lod_low=120.0
pedestrian_lod_cull=200.0

# Buildings - large static objects
building_lod_high=100.0
building_lod_medium=200.0
building_lod_low=400.0
building_lod_cull=600.0

# ============ Simulation Parameters ============
max_vehicles=100
max_pedestrians=200
initial_pedestrians=60
vehicle_spawn_rate=0.5
pedestrian_spawn_rate=0.3

# Traffic light timing (frames)
traffic_light_duration=120
yellow_light_duration=30

# ============ Graphics Settings ============
enable_lighting=true
enable_textures=true
enable_shadows=false
enable_fog=true
enable_antialiasing=false

# Window settings
window_width=1280
window_height=720
fullscreen=false

# Fog settings
fog_start=200.0
fog_end=500.0
fog_density=0.015

# ============ Camera Settings ============
camera_speed=20.0
camera_sensitivity=0.002
camera_fov=65.0
camera_near_plane=0.1
camera_far_plane=500.0

# Initial camera position
camera_start_x=0.0
camera_start_y=180.0
camera_start_z=220.0
camera_start_yaw=0.0
camera_start_pitch=-60.0

# ============ Debug Settings ============
show_fps=true
show_stats=false
stats_update_interval=60
debug_mode=false
wireframe_mode=false

# ============ World Settings ============
# City dimensions
city_width=1000.0
city_depth=1000.0

# Road settings
road_width=40.0
sidewalk_width=10.0
intersection_size=60.0

# Building settings
min_building_height=20.0
max_building_height=80.0
building_density=0.7
